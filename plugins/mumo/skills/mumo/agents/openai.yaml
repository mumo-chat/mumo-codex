interface:
  display_name: "mumo"
  short_description: "Claude, Gemini & more weigh in"
  brand_color: "#7C6F9F"
  default_prompt: "Ask me to paste an answer I don't trust, then use mumo to check it for errors, hidden assumptions and missing caveats."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "mumo"
      description: "mumo deliberation server — multi-model panel via Streamable HTTP"
      transport: "streamable_http"
      url: "https://mumo.chat/api/mcp/oauth"
